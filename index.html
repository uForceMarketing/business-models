<html lang="ru">
<head>

<title>Актуальные бизнес-модели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --purple:#7D63EC; --bgLight:#EFE9FF; --ink:#1b1340; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bgLight); overflow:hidden; }
  body { font-family:'Montserrat', system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  body.idle { cursor:none; }

  #deck { position:fixed; inset:0; }
  .slide {
    position:absolute; left:50%; top:50%;
    transform-origin:0 0;
    overflow:hidden; isolation:isolate;
    background-size:100% 100%; background-repeat:no-repeat;
    opacity:0; visibility:hidden;
    transition:opacity .55s ease, visibility 0s linear .55s;
  }
  .slide.active { opacity:1; visibility:visible; transition:opacity .55s ease, visibility 0s; z-index:2; }
  .slide .inner { position:absolute; inset:0; transition:transform .9s cubic-bezier(.2,.7,.2,1); transform:scale(1.015); }
  .slide.active .inner { transform:scale(1); }
  .slide .inner { background-size:100% 100%; background-repeat:no-repeat; }

  .ly { position:absolute; display:block; pointer-events:none; will-change:transform, opacity; }
  .ly.blend { transform-origin:0 0; object-fit:cover; }

  /* появление элементов */
  .slide .ly.enter { opacity:0; transform:translateY(22px); }
  .slide .ly.enter.fade { transform:none; }
  .slide:is(.active,.leaving) .ly.enter { animation:enterUp .75s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:var(--d,0s); }
  .slide:is(.active,.leaving) .ly.enter.fade { animation-name:enterFade; animation-duration:1.2s; }
  @keyframes enterUp { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }
  @keyframes enterFade { from { opacity:0; } to { opacity:var(--op,1); } }

  /* лёгкое «дыхание» элементов: отдельные свойства translate/rotate, не конфликтуют с transform */
  .slide:is(.active,.leaving) .ly.float { animation-name:enterUp, floatY; animation-duration:.75s, var(--fd,7s);
    animation-delay:var(--d,0s), var(--fdel,0s); animation-timing-function:cubic-bezier(.2,.7,.2,1), ease-in-out;
    animation-iteration-count:1, infinite; animation-fill-mode:forwards, none; animation-direction:normal, alternate; }
  @keyframes floatY { from { translate:0 calc(var(--amp,8px) * -1); rotate:calc(var(--rot,1deg) * -1); } to { translate:0 var(--amp,8px); rotate:var(--rot,1deg); } }

  .slide:is(.active,.leaving) .ly.drift { animation-name:enterFade, drift; animation-duration:1.2s, var(--fd,16s);
    animation-delay:var(--d,0s), var(--fdel,0s); animation-timing-function:ease, ease-in-out;
    animation-iteration-count:1, infinite; animation-fill-mode:forwards, none; animation-direction:normal, alternate; }
  @keyframes drift { 0% { translate:0 0; } 50% { translate:var(--dx,24px) var(--dy,-16px); } 100% { translate:calc(var(--dx,24px) * -.6) var(--dy2,14px); } }

  @media (prefers-reduced-motion: reduce) {
    .slide.active .ly.float, .slide:is(.active,.leaving) .ly.drift { animation-iteration-count:1, 0 !important; }
  }

  /* HUD */
  #hud { position:fixed; right:18px; bottom:14px; z-index:10; display:flex; gap:10px; align-items:center;
    font:600 13px/1 'Montserrat',sans-serif; color:rgba(255,255,255,.85); opacity:0; transition:opacity .4s; pointer-events:none; }
  body.show-hud #hud { opacity:1; }
  #hud .pill { background:rgba(20,14,48,.55); backdrop-filter:blur(6px); padding:8px 12px; border-radius:999px; }
  #bar { position:fixed; left:0; bottom:0; height:3px; background:var(--purple); z-index:10; transition:width .5s ease; opacity:.0; }
  body.show-hud #bar { opacity:.9; }

  /* Кубик Рубика */
  .rubik-wrap { position:absolute; left:0; top:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; pointer-events:none; }
  .rubik-scene { width:560px; height:560px; perspective:2200px; pointer-events:auto; cursor:grab; touch-action:none; display:flex; align-items:center; justify-content:center; }
  .rubik-scene:active { cursor:grabbing; }
  .rubik { position:relative; width:0; height:0; transform-style:preserve-3d; }
  .cubie { position:absolute; left:0; top:0; width:0; height:0; transform-style:preserve-3d; }
  .face { position:absolute; width:var(--S); height:var(--S); left:calc(var(--S) / -2); top:calc(var(--S) / -2);
    background:#1a1238; border-radius:14px; backface-visibility:hidden; }
  .face.st::after { content:''; position:absolute; inset:7px; border-radius:11px; background:var(--c);
    box-shadow:inset 0 -10px 18px rgba(0,0,0,.14), inset 0 8px 14px rgba(255,255,255,.28); }
  .rubik-controls { display:flex; gap:20px; pointer-events:auto; }
  .rubik-btn { font:600 26px/1 'Montserrat',sans-serif; color:var(--purple); background:#fff; border:0; border-radius:999px;
    padding:20px 40px; cursor:pointer; box-shadow:0 12px 32px rgba(125,99,236,.22); transition:transform .2s, box-shadow .2s; }
  .rubik-btn:hover { transform:translateY(-3px); box-shadow:0 16px 40px rgba(125,99,236,.32); }
  .rubik-btn:disabled { opacity:.55; cursor:default; transform:none; }
  .rubik-btn.primary { background:var(--purple); color:#fff; }
  .rubik-phrase-slot { height:120px; display:flex; align-items:center; justify-content:center; margin-bottom:-10px; pointer-events:none; }
  .rubik-phrase { font:600 48px/1.15 'Montserrat',sans-serif; color:var(--purple); background:#fff; border-radius:999px;
    padding:26px 56px; max-width:1500px; text-align:center; box-shadow:0 16px 44px rgba(125,99,236,.25);
    opacity:0; transform:translateY(16px) scale(.92); transition:opacity .35s ease, transform .5s cubic-bezier(.2,1.4,.4,1); }
  .rubik-phrase.show { opacity:1; transform:none; }
  .rubik-phrase.idle { font-size:30px; font-weight:500; color:rgba(27,19,64,.6); background:rgba(255,255,255,.55); box-shadow:none; padding:20px 40px; }
  .rubik-hint { font:500 18px/1 'Montserrat',sans-serif; color:rgba(27,19,64,.55); margin-top:-26px; }

  /* Слайд «Коты строят дом» */
  .cats-part { position:absolute; background-repeat:no-repeat; will-change:transform;
    -webkit-mask-image:radial-gradient(ellipse closest-side, #000 72%, transparent 100%); mask-image:radial-gradient(ellipse closest-side, #000 72%, transparent 100%); }
  .slide:is(.active,.leaving) .cats-part { animation:var(--an) var(--dur) ease-in-out var(--del,0s) infinite; }
  @keyframes catBob { 0%,100% { transform:translateY(0) rotate(0); } 50% { transform:translateY(calc(var(--a,3px) * -1)) rotate(var(--r,0deg)); } }
  @keyframes catSway { 0%,100% { transform:rotate(calc(var(--r,2deg) * -1)); } 50% { transform:rotate(var(--r,2deg)) translateY(calc(var(--a,2px) * -1)); } }
  @keyframes catPush { 0%,100% { transform:translate(0,0); } 50% { transform:translate(var(--px,8px), var(--py,-4px)); } }
  @keyframes catWave { 0%,100% { transform:rotate(calc(var(--r,12deg) * -1)); } 50% { transform:rotate(var(--r,12deg)); } }
  @keyframes catHammer { 0% { transform:rotate(-13deg); } 42% { transform:rotate(7deg); } 50% { transform:rotate(4deg); } 58% { transform:rotate(7deg); } 100% { transform:rotate(-13deg); } }
  @keyframes catWalk { 0%,100% { transform:translateY(0) rotate(-1.2deg); } 25% { transform:translateY(-6px) rotate(0deg); } 50% { transform:translateY(0) rotate(1.2deg); } 75% { transform:translateY(-6px) rotate(0deg); } }

  .mc-brick { position:absolute; width:96px; height:56px; left:0; top:0; }
  .mc-brick i { position:absolute; inset:0; border-radius:3px; background:url("assets/mc-brick.webp") center / cover;
    box-shadow:inset 0 5px 0 rgba(255,255,255,.28), inset 0 -6px 0 rgba(70,30,80,.3), 0 10px 18px rgba(70,30,90,.35); }
  .mc-fly { position:absolute; left:0; top:0; opacity:0; }
  .slide:is(.active,.leaving) .mc-fly { animation:mcFlyX var(--dur,4.2s) linear var(--del,0s) infinite; }
  .slide:is(.active,.leaving) .mc-fly .mc-brick { animation:mcFlyY var(--dur,4.2s) linear var(--del,0s) infinite; }
  @keyframes mcFlyX { 0%,14% { transform:translateX(var(--x0)); opacity:0; } 17% { opacity:1; } 52% { transform:translateX(var(--x1)); } 84% { transform:translateX(var(--x1)); opacity:1; } 94%,100% { transform:translateX(var(--x1)); opacity:0; } }
  @keyframes mcFlyY { 0%,14% { transform:translateY(var(--y0)) rotate(0); animation-timing-function:ease-out; } 33% { transform:translateY(var(--yt)) rotate(-8deg); animation-timing-function:ease-in; } 52% { transform:translateY(var(--y1)) rotate(0); } 55% { transform:translateY(calc(var(--y1) - 8px)); } 58%,100% { transform:translateY(var(--y1)); } }
  .mc-dust { position:absolute; width:12px; height:12px; background:#f4ecff; border-radius:2px; opacity:0; }
  .slide:is(.active,.leaving) .mc-dust { animation:mcDust var(--dur,4.2s) ease-out var(--del,0s) infinite; }
  @keyframes mcDust { 0%,51% { opacity:0; transform:translate(0,0) scale(.6); } 53% { opacity:.9; } 70%,100% { opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.1); } }

  .mc-petal { position:absolute; left:0; top:0; width:12px; height:12px; border-radius:2px; opacity:0; }
  .slide:is(.active,.leaving) .mc-petal { animation:mcPetal var(--dur) linear var(--del) infinite; }
  @keyframes mcPetal { 0% { opacity:0; transform:translate(var(--x0), var(--y0)) rotate(0); } 10% { opacity:.95; } 85% { opacity:.9; } 100% { opacity:0; transform:translate(var(--x1), var(--y1)) rotate(var(--rot)); } }

  .mc-glow { position:absolute; border-radius:50%; mix-blend-mode:screen; pointer-events:none;
    background:radial-gradient(circle, rgba(255,214,140,.75), rgba(255,170,90,.25) 45%, transparent 70%); }
  .slide:is(.active,.leaving) .mc-glow { animation:mcFlicker var(--dur,2.6s) steps(1) var(--del,0s) infinite, mcBreath 3.4s ease-in-out infinite; }
  @keyframes mcFlicker { 0% { opacity:.85; } 17% { opacity:.6; } 23% { opacity:.95; } 51% { opacity:.7; } 63% { opacity:1; } 80% { opacity:.75; } }
  @keyframes mcBreath { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  .mc-spark { position:absolute; width:6px; height:6px; background:#fff6d8; box-shadow:0 0 8px 2px rgba(255,236,170,.8); opacity:0; }
  .slide:is(.active,.leaving) .mc-spark { animation:mcTwinkle var(--dur) ease-in-out var(--del) infinite; }
  @keyframes mcTwinkle { 0%,100% { opacity:0; transform:scale(.5); } 50% { opacity:1; transform:scale(1); } }
  @media (prefers-reduced-motion: reduce) { .slide .cats-part, .slide .mc-fly, .slide .mc-fly .mc-brick, .slide .mc-petal, .slide .mc-spark, .slide .mc-dust { animation:none !important; } }

  @keyframes catHover { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(calc(var(--a,10px) * -1)) rotate(1deg); } }
  .mc-floater { position:absolute; }
  .mc-floater .mc-brick i { border-radius:4px; }
  .slide:is(.active,.leaving) .mc-floater { animation:mcHover var(--dur,4s) ease-in-out var(--del,0s) infinite; }
  @keyframes mcHover { 0%,100% { transform:translateY(0) rotate(calc(var(--rot,8deg) * -1)); } 50% { transform:translateY(-16px) rotate(var(--rot,8deg)); } }
  .mc-led { position:absolute; width:5px; height:5px; background:#9fd0ff; box-shadow:0 0 8px 2px rgba(120,180,255,.9); opacity:.2; }
  .slide:is(.active,.leaving) .mc-led { animation:mcLed var(--dur,1s) steps(1) var(--del,0s) infinite; }
  @keyframes mcLed { 0% { opacity:1; } 40% { opacity:.2; } 70% { opacity:.9; } }
  .mc-steam { position:absolute; width:26px; height:60px; border-radius:50%; background:radial-gradient(ellipse, rgba(255,255,255,.75), transparent 70%); filter:blur(4px); opacity:0; }
  .slide:is(.active,.leaving) .mc-steam { animation:mcSteam 3.3s ease-out var(--del,0s) infinite; }
  @keyframes mcSteam { 0% { opacity:0; transform:translate(0,20px) scale(.6); } 25% { opacity:.8; } 100% { opacity:0; transform:translate(14px,-110px) scale(1.5); } }
  @media (prefers-reduced-motion: reduce) { .slide .mc-floater, .slide .mc-led, .slide .mc-steam { animation:none !important; } }
</style>

function seeded(i){ const x = Math.sin(i * 9301 + 49297) * 233280; return x - Math.floor(x); }

    }

    img.style.width = it.w + 'px'; img.style.height = it.h + 'px';

  const bSolve = document.createElement('button'); bSolve.className = 'rubik-btn'; bSolve.textContent = 'Собрать';
  ctr.append(bMix, bSolve); wrap.appendChild(ctr);
  const hint = document.createElement('div'); hint.className = 'rubik-hint'; hint.textContent = 'Нажмите на кубик или покрутите его мышкой';

  // фразы выпадают без повторов, пока не закончится весь список
  const PHRASES = ['Подписка (Subscription)','Freemium','Бесплатный продукт + реклама','Разовая покупка','Комиссионная модель (Marketplace)',
    'Транзакционная модель','Pay-per-use','Лицензирование','Франшиза','Роялти','Аренда','Лизинг','Прямые продажи','Дистрибуция',
    'Оптовая модель','Розничная модель','D2C','B2B','B2C','C2C','B2B2C','SaaS','PaaS','IaaS','API-as-a-Service','Usage-based pricing',
    'Outcome-based pricing','Lead generation','Affiliate marketing','Dropshipping','Print-on-demand','Crowdfunding','Донаты',
    'Партнерская модель','White label','Private label','Open core','Marketplace','On-demand','Sharing economy','Razor-and-blades',
    'Loss leader','Hidden revenue','Pay-what-you-want','Bundling','Cross-subsidization','Data monetization','Attention economy',
    'Auction','Bidding','Membership','Managed services','Professional services','Agency model','Consulting','Contract manufacturing',
    'Manufacturing-as-a-Service (MaaS)','Product-as-a-Service (PaaS)','Everything-as-a-Service (XaaS)'];
  let bag = [], lastPhrase = '';
  const pick = () => {
    if (!bag.length) { bag = PHRASES.slice(); for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      if (bag[bag.length - 1] === lastPhrase) bag.unshift(bag.pop()); }
    return lastPhrase = bag.pop();
  };
  const slot = document.createElement('div'); slot.className = 'rubik-phrase-slot';
  const phrase = document.createElement('div'); phrase.className = 'rubik-phrase idle show'; phrase.textContent = 'Нажмите на кубик, чтобы выпала бизнес-модель';
  slot.appendChild(phrase); wrap.insertBefore(slot, scene);
  const randomMoves = n => { const moves = []; let lastAx = -1;
    for (let i = 0; i < n; i++) { let ax; do { ax = Math.floor(Math.random() * 3); } while (ax === lastAx); lastAx = ax;
      moves.push([ax, [-1, 0, 1][Math.floor(Math.random() * 3)], Math.random() < .5 ? 1 : -1]); }
    return moves; };
  async function roll(){
    if (busy) return;
    phrase.classList.remove('show');
    vy += 14; // лёгкий «бросок» кубика
    const moves = randomMoves(6); history = history.concat(moves);
    await run(moves, 110);
    phrase.classList.remove('idle'); phrase.textContent = pick();
    void phrase.offsetWidth; phrase.classList.add('show');
  }
  wrap.appendChild(hint);
  function setBtns(){ bMix.disabled = busy; bSolve.disabled = busy || !history.length; }
  setBtns();
  bMix.addEventListener('click', e => {
    e.stopPropagation(); if (busy) return;
    const moves = randomMoves(20);
    history = history.concat(moves); run(moves, 190);
  });
  bSolve.addEventListener('click', e => {
    e.stopPropagation(); if (busy || !history.length) return;
    const moves = history.slice().reverse().map(m => [m[0], m[1], -m[2]]); history = [];
    run(moves, 140);
  });
  [bMix, bSolve].forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));
  return wrap;
}

function buildCats(s){
  const C = CAT_SCENES[s.custom];
  const layer = document.createElement('div'); layer.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
  const kx = s.w / C.IW, ky = s.h / C.IH;
  const P = (x, y) => [x * kx, y * ky];
  const add = (cls, css, vars) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css || {});
    Object.entries(vars || {}).forEach(([k, v]) => d.style.setProperty(k, v)); layer.appendChild(d); return d; };
  // куски той же картинки поверх оригинала: лапы, кирпичи, коты
  C.parts.forEach(p => {
    const [x, y, w, h] = p.r;
    add('cats-part', { left:x * kx + 'px', top:y * ky + 'px', width:w * kx + 'px', height:h * ky + 'px',
      backgroundImage:`url("${s.bg}")`, backgroundSize:`${s.w}px ${s.h}px`, backgroundPosition:`${-x * kx}px ${-y * ky}px`, transformOrigin:p.o },
      Object.assign({ '--an':p.an, '--dur':p.dur }, p.del ? { '--del':p.del } : {}, p.v || {}));
  });
  const brickEl = () => { const br = document.createElement('div'); br.className = 'mc-brick';
    br.style.width = C.brick.w + 'px'; br.style.height = C.brick.h + 'px';
    const i = document.createElement('i'); i.style.backgroundImage = `url("${C.brick.tex}")`; br.appendChild(i); return br; };
  // кирпичи летят к стройке и встают на место
  (C.flights || []).forEach(b => {
    const f = P(...b.from), t = P(...b.to), T = { '--dur':b.dur + 's', '--del':b.del + 's' };
    const w = add('mc-fly', {}, Object.assign({ '--x0':f[0] + 'px', '--x1':t[0] + 'px' }, T));
    const br = brickEl(); w.appendChild(br);
    Object.entries(Object.assign({ '--y0':f[1] + 'px', '--y1':t[1] + 'px', '--yt':b.top * ky + 'px' }, T)).forEach(([k, v]) => br.style.setProperty(k, v));
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI * (1 + i / 5);
      add('mc-dust', { left:(t[0] + C.brick.w / 2 - 6 + (i - 2.5) * 11) + 'px', top:(t[1] + C.brick.h - 8) + 'px' },
        Object.assign({ '--dx':Math.cos(ang) * 46 + 'px', '--dy':(Math.sin(ang) * 30 - 6) + 'px' }, T));
    }
  });
  // кубики, парящие в воздухе
  (C.floaters || []).forEach(([x, y, sz], i) => {
    const c = P(x, y);
    const f = add('mc-floater', { left:c[0] + 'px', top:c[1] + 'px' },
      { '--dur':(3.2 + seeded(i + 50) * 2).toFixed(2) + 's', '--del':(-seeded(i + 60) * 4).toFixed(2) + 's', '--rot':(6 + seeded(i + 70) * 10).toFixed(1) + 'deg' });
    const br = brickEl(); br.style.width = br.style.height = sz + 'px'; br.style.position = 'relative'; f.appendChild(br);
  });
  // фонари, солнце, светящиеся значки
  (C.glows || []).forEach(([x, y, r], i) => {
    const c = P(x, y), R = r * kx;
    add('mc-glow', { left:c[0] - R / 2 + 'px', top:c[1] - R / 2 + 'px', width:R + 'px', height:R + 'px' },
      { '--dur':(2.2 + i * .5) + 's', '--del':(-i * .7) + 's' });
  });
  // огоньки серверов
  if (C.leds) for (let i = 0; i < C.leds.n; i++) {
    const c = P(C.leds.x[0] + seeded(i + 300) * (C.leds.x[1] - C.leds.x[0]), C.leds.y[0] + seeded(i + 400) * (C.leds.y[1] - C.leds.y[0]));
    add('mc-led', { left:c[0] + 'px', top:c[1] + 'px' }, { '--dur':(0.6 + seeded(i + 500) * 1.4).toFixed(2) + 's', '--del':(-seeded(i + 600) * 2).toFixed(2) + 's' });
  }
  // пар из кружки
  if (C.steam) for (let i = 0; i < 3; i++) {
    const c = P(...C.steam);
    add('mc-steam', { left:c[0] - 20 + i * 14 + 'px', top:c[1] - 40 + 'px' }, { '--del':(-i * 1.1) + 's' });
  }
  // блики на воде
  if (C.sparks) for (let i = 0; i < C.sparks.n; i++) {
    const c = P(C.sparks.x[0] + seeded(i + 7) * (C.sparks.x[1] - C.sparks.x[0]), C.sparks.y[0] + seeded(i + 31) * (C.sparks.y[1] - C.sparks.y[0]));
    add('mc-spark', { left:c[0] + 'px', top:c[1] + 'px' },
      { '--dur':(1.6 + seeded(i + 3) * 1.8).toFixed(2) + 's', '--del':(-seeded(i + 11) * 3).toFixed(2) + 's' });
  }
  // падающие пиксельные лепестки
  const PET = ['#f7c3ec', '#eeb0f2', '#ffd6f4', '#d9a6ff'];
  if (C.petals) for (let i = 0; i < C.petals.n; i++) {
    const a = C.petals.areas[i % C.petals.areas.length], r1 = seeded(i + 101), r2 = seeded(i + 202);
    const x0 = a[0] + r1 * a[2], y0 = a[1] + r2 * a[3];
    const c0 = P(x0, y0), c1 = P(x0 + 140 + r2 * 160, y0 + 480 + r1 * 260), sz = 9 + r1 * 8;
    add('mc-petal', { background:PET[i % PET.length], width:sz + 'px', height:sz + 'px' },
      { '--x0':c0[0] + 'px', '--y0':c0[1] + 'px', '--x1':c1[0] + 'px', '--y1':c1[1] + 'px',
        '--rot':(180 + r2 * 360).toFixed(0) + 'deg', '--dur':(7 + r2 * 6).toFixed(1) + 's', '--del':(-r1 * 12).toFixed(1) + 's' });
  }
  return layer;
}
